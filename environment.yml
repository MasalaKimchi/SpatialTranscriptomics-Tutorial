# Conda environment for the Spatial Transcriptomics Tutorial.
# Create with:   conda env create -f environment.yml
# Activate with: conda activate spatial-tx
# Register kernel: python -m ipykernel install --user --name spatial-tx
name: spatial-tx
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy>=1.23
  - pandas>=1.5
  - scipy>=1.9
  - matplotlib>=3.6
  - seaborn>=0.12
  - scikit-learn>=1.2
  - scikit-image>=0.20
  - leidenalg>=0.9
  - python-igraph>=0.10
  - pooch>=1.7
  - requests>=2.28
  - tqdm>=4.64
  - jupyter
  - ipykernel
  - pip:
      - scanpy>=1.9
      - squidpy>=1.3
      - anndata>=0.9
      - opencv-python>=4.7
