seed: 0

cohorts:
  oncology:
    - V1_Breast_Cancer_Block_A_Section_1
    - V1_Breast_Cancer_Block_A_Section_2
    - Visium_FFPE_Human_Breast_Cancer
    - Parent_Visium_Human_BreastCancer
  external:
    - Parent_Visium_Human_ColorectalCancer
    - Parent_Visium_Human_OvarianCancer
    - Targeted_Visium_Human_Glioblastoma_Pan_Cancer
  benchmark:
    - visium_hne

preprocessing:
  min_counts: 500
  min_cells: 3
  max_pct_mito: 30
  n_top_genes_hvg: 2000
  n_pcs: 50
  n_neighbors: 15
  n_pcs_neighbors: 30
  leiden_resolution: 1.0

marker_genes:
  breast:
    - ESR1
    - ERBB2
    - PGR
    - MKI67
    - CD8A
    - CD3D
    - COL1A1
    - ACTA2
  colorectal:
    - KRT20
    - CDX2
    - CD8A
    - CD3D
    - COL1A1
    - MKI67
  ovarian:
    - PAX8
    - WT1
    - CD8A
    - CD3D
    - COL1A1
    - MKI67
  glioblastoma:
    - GFAP
    - OLIG2
    - CD8A
    - CD3D
    - COL1A1
    - MKI67
  mouse_brain:
    - Mbp
    - Snap25
    - Gfap
    - Plp1

gene_modules:
  immune_activation:
    - CD3D
    - CD8A
    - IFNG
    - GZMB
    - CXCL9
    - CXCL10
  t_cell_infiltration:
    - CD3D
    - CD3E
    - CD8A
    - CD4
    - LCK
  ecm_fibrosis:
    - COL1A1
    - COL1A2
    - COL3A1
    - FN1
    - ACTA2
  proliferation:
    - MKI67
    - TOP2A
    - PCNA
    - CCNB1
  hypoxia:
    - HIF1A
    - VEGFA
    - LDHA
    - CA9
    - BNIP3

patches:
  min_patch_px: 8
  output_size: 224

training:
  # Backbone: resnet18 (default/fast), resnet50, efficientnet_b0,
  # convnext_tiny, vit_b_16 — all ImageNet-pretrained via torchvision.
  model: resnet18
  pretrained: true
  # Device: auto (CUDA → MPS → CPU), or cuda | mps | cpu
  device: auto
  batch_size: 32
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001
  cls_weight: 1.0
  reg_weight: 1.0
  patience: 3
  num_workers: 0

evaluation:
  primary_metrics:
    classification: [balanced_accuracy, macro_f1]
    regression: [pearson_r, r2]
