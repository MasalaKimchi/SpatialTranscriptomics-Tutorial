seed: 0
experiment: v2_remediation

cohorts:
  oncology:
    - V1_Breast_Cancer_Block_A_Section_1
    - V1_Breast_Cancer_Block_A_Section_2
    - Visium_FFPE_Human_Breast_Cancer
    - Parent_Visium_Human_BreastCancer
  external:
    - Parent_Visium_Human_ColorectalCancer
    - Parent_Visium_Human_OvarianCancer
    - Targeted_Visium_Human_Glioblastoma_Pan_Cancer
  benchmark:
    - visium_hne

cohort_policy:
  allow_partial: false

preprocessing:
  min_counts: 500
  min_cells: 3
  max_pct_mito: 30
  n_top_genes_hvg: 2000
  n_pcs: 50
  n_neighbors: 15
  n_pcs_neighbors: 30
  leiden_resolution: 1.0

# Harmonized TME labels (cross-slide comparable) + module-score regression targets.
labels:
  classification_col: tme_class_id
  # modules = spot-robust programs; genes = optional secondary targets
  regression_targets: modules
  tme_classes:
    - tumor_epithelial
    - immune_enriched
    - stromal
    - proliferative
    - hypoxic
    - other

marker_genes:
  breast:
    - ESR1
    - ERBB2
    - PGR
    - MKI67
    - CD8A
    - CD3D
    - COL1A1
    - ACTA2
  colorectal:
    - KRT20
    - CDX2
    - CD8A
    - CD3D
    - COL1A1
    - MKI67
  ovarian:
    - PAX8
    - WT1
    - CD8A
    - CD3D
    - COL1A1
    - MKI67
  glioblastoma:
    - GFAP
    - OLIG2
    - CD8A
    - CD3D
    - COL1A1
    - MKI67
  mouse_brain:
    - Mbp
    - Snap25
    - Gfap
    - Plp1

gene_modules:
  immune_activation:
    - CD3D
    - CD8A
    - IFNG
    - GZMB
    - CXCL9
    - CXCL10
  t_cell_infiltration:
    - CD3D
    - CD3E
    - CD8A
    - CD4
    - LCK
  ecm_fibrosis:
    - COL1A1
    - COL1A2
    - COL3A1
    - FN1
    - ACTA2
  proliferation:
    - MKI67
    - TOP2A
    - PCNA
    - CCNB1
  hypoxia:
    - HIF1A
    - VEGFA
    - LDHA
    - CA9
    - BNIP3

patches:
  version: v2
  # 3x spot diameter => ~45px native vs 15px (less destructive upscale to 224)
  context_scale: 3.0
  min_patch_px: 8
  output_size: 224
  # Per-slide Macenko reduces FFPE vs fresh-frozen stain shift
  per_slide_stain_norm: true

training:
  model: resnet18
  pretrained: true
  device: auto
  batch_size: 32
  epochs: 20
  lr: 0.0001
  weight_decay: 0.0001
  # De-emphasize classification; prioritize module regression
  cls_weight: 0.25
  reg_weight: 1.0
  patience: 5
  num_workers: 0
  augment: true

# Optional inference-only pathology foundation model. The encoder stays frozen;
# only logistic/ridge probes are fitted within each LOSO training fold.
foundation:
  enabled: false
  model: kaiko_vits16
  # Alternative full-cohort comparison: phikon (86M parameters, 768-D).
  device: auto
  batch_size: 64
  cache: true
  # kaiko_vits16 is compact and ungated, but its weights are non-commercial.
  # Set enabled=true only for research/tutorial use; see README for alternatives.

evaluation:
  primary_metrics:
    classification: [balanced_accuracy, macro_f1]
    regression: [pearson_r, r2]
