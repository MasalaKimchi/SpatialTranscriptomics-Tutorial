[project]
name = "spatial-transcriptomics-tutorial"
version = "0.1.0"
description = "Spatial transcriptomics tutorial with optional pharma DL extension"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
pharma = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0",
    "huggingface-hub>=0.24",
    "transformers>=4.40",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]

[tool.setuptools.package-dir]
"" = "."
