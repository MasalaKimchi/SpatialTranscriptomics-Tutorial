[project]
name = "spatial-transcriptomics-tutorial"
version = "0.1.0"
description = "Spatial transcriptomics tutorial with optional pharma DL extension"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
pharma = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0",
    "huggingface-hub>=0.24",
    "transformers>=4.40",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
addopts = "--strict-markers -m offline"
markers = [
    "offline: CPU-small evidence that must not access external services",
    "notebook_smoke: opt-in notebook execution smoke evidence",
    "network: opt-in evidence that may access public network services",
    "full_cohort: opt-in evidence that runs against complete scientific cohorts",
]

[tool.ruff]
target-version = "py311"
src = [
    "utils",
    "scripts",
    "projects/spatial-pharma-dl/src",
    "projects/spatial-pharma-dl/scripts",
    "projects/spatial-pharma-dl/tests",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
